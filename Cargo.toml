[package]
name = "zigurate"
description = "A domain-specific language for game designers, writters and worldbuilders, focused on query and local database. Designed in Rust."
version = "0.1.5"
license = "MIT"
edition = "2024"
repository = "https://github.com/G4brielXavier/ziguratelang"
readme = "README.md"
keyword = ["programming-language", "interpreter", "dsl"]
categories = ["compilers"]
documentation = "https://ziguratedsl.vercel.app"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
dirs = "7.0"
chrono = "0.4"
memmap2 = "0.9"
walkdir = "2"
thiserror = "2.0"
serde_yaml = "0.9"
env = "1.0"
colored = "3.1.1"


[[bin]]
name = "enki"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true